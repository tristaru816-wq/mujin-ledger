function parseEntry(raw){const s=String(raw||'').trim().replace(/[，,](?=\d{3}(?:\D|$))/g,'');let desc='',amount;

function renderHome(){const now=today();const mo=now.slice(0,7);const daySpending=sum(state.records.filter(r=>r.date===now),'expense');const monthRecs=state.records.filter(r=>r.date.startsWith(mo));const expenses=sum(monthRecs,'expense'),income=sum(monthRecs,'income');const recent=sorted(state.records).slice(0,3);
return `<section class="home"><div class="hero"><div class="orb" aria-hidden="true"><div class="orb-inner"><span>m</span></div></div><div class="eyebrow">YOUR PRIVATE LEDGER</div><h1>想記什麼？</h1><p>一行文字，記下生活的每筆花費。<br>簡單一點，讓理財成為習慣。</p><div class="subline"></div></div>
${cloudBanner()}${location.protocol==='file:'?'<div class="file-warning"><strong>目前使用本機檔案</strong>：iPhone 的檔案預覽可能限制互動或資料儲存。正式記帳請使用 Safari 開啟 HTTPS 網址，並定期備份資料。</div>':''}<section class="search-section"><div class="field-head"><span class="label">✦ 快速輸入</span><span class="muted-small">自動分類 · 台幣 NT$</span></div><form id="quickForm" autocomplete="off"><div class="searchbox"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.3 15.3 5.1 5.1" stroke-linecap="round"/></svg><input id="quickInput" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" spellcheck="false" aria-label="輸入項目與金額" placeholder="例如：午餐 800" maxlength="140" required/><button class="submit-btn" type="submit" aria-label="送出並記帳"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></form>${state.accounts.length?`<div class="quick-account"><label for="quickAccount">付款／入帳帳戶</label><select id="quickAccount">${formatAccountOptions(state.selectedAccount||state.accounts[0].id)}</select></div>`:(isCloud()?'<p class="hint">尚未建立帳戶，請先到「資產帳戶」完成 V2.1 初始化。</p>':'')}<p class="hint">輸入項目與金額後，按 Enter 或右側箭頭即完成記帳。外幣可輸入「Claude 20 USD」。</p><div class="examples"><button class="example-chip" data-example="午餐 800">午餐 800</button><button class="example-chip" data-example="捷運 50">捷運 50</button><button class="example-chip" data-example="薪水 50000">薪水 50000</button></div></section>
<section><div class="section-heading"><h2>本月收支速覽</h2><button data-page-link="records">查看分析 ↗</button></div><div class="metric-grid"><div class="metric highlight"><span>今日支出</span><strong><em>$</em>${formatNumber(daySpending)}</strong><div class="note">${html(friendlyDate(now))} · 今日累計</div></div><div class="metric"><span>本月支出</span><strong><em>$</em>${formatNumber(expenses)}</strong><div class="note">本月收入 ${money(income)}</div></div></div></section>
<section><div class="section-heading"><h2>最近紀錄</h2><button data-page-link="records">全部紀錄 ↗</button></div><div class="recent-card">${recent.length?recent.map(r=>renderRow(r,false)).join(''):'<div class="empty-home">目前還沒有記帳紀錄<br>從上方輸入「午餐 800」開始 ✦</div>'}</div></section><div style="height:21px"></div></section>`}
function renderRow(r,details=true){const ico=CATEGORY_ICONS[r.category]||'◇';const acct=r.accountId?accountName(r.accountId):'';const meta=[r.category,friendlyDate(r.date),acct,r.originalCurrency?(r.originalAmount+' '+r.originalCurrency+' @ '+Number(r.exchangeRate||0).toFixed(4)):''].filter(Boolean).join(' · ');return `<div class="tr-row ${details?'detail':''}"><div class="tr-main"><div class="tr-icon" aria-hidden="true">${ico}</div><div class="tr-info"><div class="tr-name">${html(r.description)}</div><div class="tr-meta">${html(meta)}</div></div><div class="tr-amount ${r.type}">${r.type==='income'?'+':'−'}${formatNumber(r.amount)}</div></div>${details?`<div class="tr-actions"><button class="tiny-icon" data-edit="${html(r.id)}" aria-label="編輯 ${html(r.description)}">✎</button><button class="tiny-icon" data-delete="${html(r.id)}" aria-label="刪除 ${html(r.description)}">×</button></div>`:''}</div>`}
function periodRange(){const d=new Date(state.anchor.getFullYear(),state.anchor.getMonth(),state.anchor.getDate(),12);if(state.period==='day'){const y=ymd(d);return{start:y,end:y,label:d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 週'+'日一二三四五六'[d.getDay()]}}if(state.period==='week'){const offset=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-offset);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{start:ymd(mon),end:ymd(sun),label:(mon.getMonth()+1)+'/'+mon.getDate()+' — '+(sun.getMonth()+1)+'/'+sun.getDate()+' · 本週區間'}}if(state.period==='month'){const st=new Date(d.getFullYear(),d.getMonth(),1,12),en=new Date(d.getFullYear(),d.getMonth()+1,0,12);return{start:ymd(st),end:ymd(en),label:d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月'}}return{start:'0000-01-01',end:'9999-12-31',label:'所有歷史紀錄'}}
function getFiltered(){const range=periodRange();let out=state.records.filter(r=>r.date>=range.start&&r.date<=range.end);if(state.period==='history'){const query=state.query.toLowerCase().trim();if(query)out=out.filter(r=>r.description.toLowerCase().includes(query)||r.category.includes(query)||String(r.amount).includes(query));if(state.historyType!=='all')out=out.filter(r=>r.type===state.historyType);if(state.historyCategory!=='all')out=out.filter(r=>r.category===state.historyCategory);if(state.from)out=out.filter(r=>r.date>=state.from);if(state.to)out=out.filter(r=>r.date<=state.to)}return sorted(out)}
function historyFilters(){const cats=['all','收入',...CATEGORY_LIST];return `<div class="filters"><input class="filter-input wide" id="historyQuery" placeholder="搜尋項目、分類或金額" value="${html(state.query)}" aria-label="歷史紀錄關鍵字查詢"/><select class="filter-input" id="historyType" aria-label="收支類型"><option value="all" ${state.historyType==='all'?'selected':''}>全部收支</option><option value="expense" ${state.historyType==='expense'?'selected':''}>只有支出</option><option value="income" ${state.historyType==='income'?'selected':''}>只有收入</option></select><select class="filter-input" id="historyCategory" aria-label="消費分類">${cats.map(c=>`<option value="${c}" ${state.historyCategory===c?'selected':''}>${c==='all'?'全部分類':c}</option>`).join('')}</select><div class="date-field"><label for="fromDate">開始日期</label><input type="date" class="filter-input" id="fromDate" value="${html(state.from)}"/></div><div class="date-field"><label for="toDate">結束日期</label><input type="date" class="filter-input" id="toDate" value="${html(state.to)}"/></div></div>`}
function renderRecords(){const range=periodRange();const records=getFiltered();const expenses=sum(records,'expense'),income=sum(records,'income'),balance=income-expenses;return `<section class="records-page"><div class="page-eyebrow">YOUR MONEY, IN FOCUS</div><h1>紀錄與分析</h1>${cloudBanner()}<div class="period-tabs" role="tablist" aria-label="紀錄期間">${[['day','每天'],['week','每週'],['month','每月'],['history','歷史']].map(([k,n])=>`<button data-period="${k}" role="tab" aria-selected="${state.period===k}" class="${state.period===k?'selected':''}">${n}</button>`).join('')}</div><div class="date-navigator"><div class="date-label">${html(range.label)}</div>${state.period!=='history'?'<div class="date-arrows"><button data-step="-1" aria-label="上一個期間">‹</button><button data-step="1" aria-label="下一個期間">›</button></div>':'<span class="muted-small">自動保存</span>'}</div>${state.period==='history'?historyFilters():''}<div class="record-summary"><div class="summary-item"><div class="sm-label">總支出</div><div class="sm-value">${formatNumber(expenses)}</div></div><div class="summary-item"><div class="sm-label">總收入</div><div class="sm-value">${formatNumber(income)}</div></div><div class="summary-item"><div class="sm-label">收支結餘</div><div class="sm-value ${balance>=0?'balance-positive':'balance-negative'}">${balance<0?'−':''}${formatNumber(Math.abs(balance))}</div></div></div><div class="mode-switch"><button data-mode="details" class="${state.mode==='details'?'selected':''}">交易明細</button><button data-mode="analysis" class="${state.mode==='analysis'?'selected':''}">消費分析</button></div><div id="recordsContent">${state.mode==='details'?renderDetails(records):renderAnalytics(records)}</div><div style="height:20px"></div></section>`}
function renderDetails(records){if(!records.length)return `<div class="empty-list"><div class="empty-illustration">◇</div><strong>這個期間沒有符合的紀錄</strong><p>到「快速記帳」新增消費，<br>就能在這裡看到每筆明細。</p></div>`;let group='',out='';for(const r of records){if(r.date!==group){if(group)out+='</div></div>';group=r.date;out+=`<div class="day-group"><div class="day-group-label"><span>${html(friendlyDate(group))}</span><span>支出 ${money(sum(records.filter(x=>x.date===group),'expense'))}</span></div><div class="transaction-list">`}out+=renderRow(r)}out+='</div></div>';return out}
function categoryInfo(records){const expenseRecords=records.filter(r=>r.type==='expense');const total=sum(expenseRecords,'expense');const groups={};for(const r of expenseRecords)groups[r.category]=(groups[r.category]||0)+r.amount;return{total,items:Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value,ratio:total?value/total*100:0,color:CATEGORY_COLORS[name]||CATEGORY_COLORS['其他']}))}}
function barData(records){const expense=records.filter(r=>r.type==='expense');const now=state.anchor;let buckets=[];if(state.period==='month'){const start=new Date(now.getFullYear(),now.getMonth(),1,12),end=new Date(now.getFullYear(),now.getMonth()+1,0,12);let index=1;for(let day=1;day<=end.getDate();day+=7){const d1=new Date(start.getFullYear(),start.getMonth(),day,12);const d2=new Date(start.getFullYear(),start.getMonth(),Math.min(day+6,end.getDate()),12);buckets.push({label:'第'+index+++'週',start:ymd(d1),end:ymd(d2)})}}else if(state.period==='history'){let d=new Date();d=new Date(d.getFullYear(),d.getMonth(),1,12);for(let i=5;i>=0;i--){const start=new Date(d.getFullYear(),d.getMonth()-i,1,12),end=new Date(d.getFullYear(),d.getMonth()-i+1,0,12);buckets.push({label:(start.getMonth()+1)+'月',start:ymd(start),end:ymd(end)})}}else{let first;if(state.period==='week'){first=fromYmd(periodRange().start)}else{first=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6,12)}for(let i=0;i<7;i++){const d=new Date(first);d.setDate(first.getDate()+i);buckets.push({label:state.period==='day'?(d.getMonth()+1)+'/'+d.getDate():'一二三四五六日'[i],start:ymd(d),end:ymd(d)})}}
  return buckets.map(b=>({...b,value:sum(expense.filter(r=>r.date>=b.start&&r.date<=b.end),'expense')}))}
function renderAnalytics(records){const {total,items}=categoryInfo(records);const charts=barData(records);let pct=0;const slices=items.map((x)=>{const start=pct;pct+=x.ratio;return `${x.color} ${start.toFixed(3)}% ${pct.toFixed(3)}%`});const gradient=slices.length?'conic-gradient('+slices.join(',')+')':'conic-gradient(#45404a 0% 100%)';const max=Math.max(1,...charts.map(x=>x.value));const first=items[0];return `<div class="analytics-card"><div class="analytics-title"><h3>消費分類占比</h3><span>僅計算支出</span></div>${items.length?`<div class="donut-wrap"><div class="donut" style="background:${gradient}"><div class="donut-center"><span>支出總額</span><strong>$${formatNumber(total)}</strong></div></div><div class="legend">${items.slice(0,6).map(item=>`<div class="legend-row"><span class="dot" style="background:${item.color}"></span><span class="legend-name">${html(item.name)}</span><b>${item.ratio.toFixed(1)}%</b></div>`).join('')}${items.length>6?`<div class="legend-row"><span class="legend-name">其他 ${items.length-6} 類</span></div>`:''}</div></div><div class="analysis-note">花費最多：${html(first.name)}，共 ${money(first.value)}，占總支出的 ${first.ratio.toFixed(1)}%。</div>`:'<div class="chart-empty">目前沒有支出資料<br>記下一筆消費，就會開始生成分類圖表。</div>'}</div>
<div class="analytics-card"><div class="analytics-title"><h3>${state.period==='month'?'每週支出趨勢':state.period==='history'?'近六個月支出趨勢':state.period==='week'?'本週每日支出':'七日支出趨勢'}</h3><span>單位：NT$</span></div><div class="bars">${charts.map(x=>`<div class="bar-col"><span class="bar-number">${x.value?html(formatNumber(x.value)):''}</span><div class="bar-track"><div class="bar-fill ${x.value?'':'zero'}" style="height:${Math.max(3,Math.round(x.value/max*103))}px" title="${html(x.label)}：NT$ ${formatNumber(x.value)}"></div></div><span class="bar-label">${html(x.label)}</span></div>`).join('')}</div><div class="analysis-note">統計會隨期間、歷史搜尋及篩選條件同步更新。</div></div>`}
function renderAssets(){const total=state.accounts.reduce((n,a)=>n+Number(a.balance||0),0);const latest=[...state.transfers].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,8);const opts=formatAccountOptions();return `<section class="assets-page"><div class="page-eyebrow">ASSETS, CLEARLY</div><h1>資產帳戶</h1>${cloudBanner()}<div class="asset-total"><span>目前總資產</span><strong>${money(total)}</strong><small>${state.accounts.length?state.accounts.length+' 個帳戶 · 雲端即時同步':'尚未初始化帳戶'}</small></div><div class="asset-section"><h2>新增帳戶</h2><form id="accountForm" class="asset-form"><div class="two"><div><label>帳戶名稱</label><input id="accountName" maxlength="40" placeholder="例如：永豐銀行／台新／街口" required></div><div><label>帳戶類型</label><select id="accountKind"><option value="bank">銀行帳戶</option><option value="cash">現金</option><option value="savings">儲蓄／零錢筒</option></select></div></div><div><label>目前餘額（NT$）</label><input id="accountBalance" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" required></div><button type="submit">新增帳戶</button></form><p class="hint">銀行名稱完全由使用者自行輸入，不預設任何銀行。</p></div>${state.accounts.length?`<div class="account-grid">${state.accounts.map(a=>`<div class="account-card"><div class="a-top"><b>${html(a.name)}</b><span class="a-kind">${a.kind==='cash'?'現金':a.kind==='savings'?'儲蓄':'銀行'}</span></div><strong>${money(a.balance)}</strong><div class="row" style="margin-top:10px"><button data-adjust-account="${html(a.id)}">校正餘額</button><button data-delete-account="${html(a.id)}" class="danger-text">刪除</button></div></div>`).join('')}</div><div class="asset-section"><h2>帳戶轉移／提款</h2><form id="transferForm" class="asset-form"><div class="two"><div><label>轉出帳戶</label><select id="transferFrom" required>${opts}</select></div><div><label>轉入帳戶</label><select id="transferTo" required>${opts}</select></div></div><div class="two"><div><label>金額</label><input id="transferAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="例如 2000" required></div><div><label>備註</label><input id="transferDesc" maxlength="80" placeholder="例如：銀行提款"></div></div><button type="submit">完成資金轉移</button></form></div><div class="asset-section"><h2>美元 → 台幣匯率</h2><div class="fx-box"><div><div class="fx-rate">${state.fxRate?'1 USD ≈ NT$ '+Number(state.fxRate).toFixed(4):'尚未查詢'}</div><div class="fx-meta">快速記帳可直接輸入「工具 20 USD」自動換算</div></div><button data-refresh-fx="1">更新匯率</button></div></div><div class="asset-section"><h2>最近資金轉移</h2><div class="transfer-list">${latest.length?latest.map(t=>`<div class="transfer-item"><div><b>${html(t.description||'帳戶轉移')}</b><small>${html(accountName(t.fromAccountId))} → ${html(accountName(t.toAccountId))} · ${html(friendlyDate(t.date))}</small></div><div class="transfer-amount">${money(t.amount)}</div></div>`).join(''):'<div class="empty-home">目前沒有資金轉移紀錄</div>'}</div></div>`:`<div class="asset-section"><h2>開始建立你的帳戶</h2><p class="hint">先新增「現金」、銀行帳戶或儲蓄帳戶，再開始帳戶制記帳。</p></div>`}<div style="height:20px"></div></section>`}
async function createAccount(name,kind,balance){if(!isCloud())throw Error('請先登入雲端');name=String(name||'').trim();kind=['cash','bank','savings'].includes(kind)?kind:'bank';balance=Number(balance);if(!name)throw Error('請輸入帳戶名稱');if(!Number.isFinite(balance)||balance<0)throw Error('餘額不正確');if(state.accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()))throw Error('已存在同名帳戶');const id=uuid(),now=Date.now(),ref=cloud.firebase.dbmod.doc(cloud.db,'users',cloud.user.uid,'accounts',id);await cloud.firebase.dbmod.setDoc(ref,{id,name:name.slice(0,40),balance,kind,createdAt:now,updatedAt:now});return id}
async function deleteAccount(id){if(!isCloud())throw Error('請先登入雲端');const a=state.accounts.find(x=>x.id===id);if(!a)throw Error('找不到帳戶');if(Number(a.balance)!==0)throw Error('請先把帳戶餘額轉出或校正為 0');if(state.records.some(r=>r.accountId===id)||state.transfers.some(t=>t.fromAccountId===id||t.toAccountId===id))throw Error('此帳戶已有交易或轉移紀錄，不能刪除');await cloud.firebase.dbmod.deleteDoc(cloud.firebase.dbmod.doc(cloud.db,'users',cloud.user.uid,'accounts',id))}
async function createTransfer(fromId,toId,amount,description){if(!isCloud())throw Error('請先登入雲端');if(fromId===toId)throw Error('轉出與轉入帳戶不可相同');amount=Number(amount);if(!Number.isFinite(amount)||amount<=0)throw Error('金額不正確');const dbm=cloud.firebase.dbmod,id=uuid(),date=today(),createdAt=Date.now();const fromRef=dbm.doc(cloud.db,'users',cloud.user.uid,'accounts',fromId),toRef=dbm.doc(cloud.db,'users',cloud.user.uid,'accounts',toId),trRef=dbm.doc(cloud.db,'users',cloud.user.uid,'transfers',id);await dbm.runTransaction(cloud.db,async tx=>{const [fs,ts]=await Promise.all([tx.get(fromRef),tx.get(toRef)]);if(!fs.exists()||!ts.exists())throw Error('找不到帳戶');const fb=Number(fs.data().balance||0),tb=Number(ts.data().balance||0);if(fb<amount)throw Error('轉出帳戶餘額不足');tx.update(fromRef,{balance:fb-amount,updatedAt:Date.now()});tx.update(toRef,{balance:tb+amount,updatedAt:Date.now()});tx.set(trRef,{id,date,description:String(description||'帳戶轉移').slice(0,80),amount,fromAccountId:fromId,toAccountId:toId,createdAt})})}
async function adjustAccount(id,balance){if(!isCloud())throw Error('請先登入雲端');balance=Number(balance);if(!Number.isFinite(balance)||balance<0)throw Error('餘額不正確');const ref=cloud.firebase.dbmod.doc(cloud.db,'users',cloud.user.uid,'accounts',id);await cloud.firebase.dbmod.updateDoc(ref,{balance,updatedAt:Date.now()})}
async function cloudCreateRecord(rec){const dbm=cloud.firebase.dbmod;if(!rec.accountId){await dbm.setDoc(cloudRef(rec.id),normalize(rec));return}const aRef=dbm.doc(cloud.db,'users',cloud.user.uid,'accounts',rec.accountId),rRef=cloudRef(rec.id);await dbm.runTransaction(cloud.db,async tx=>{const s=await tx.get(aRef);if(!s.exists())throw Error('找不到所選帳戶');const bal=Number(s.data().balance||0),next=bal+accountDelta(rec);if(next<0)throw Error('帳戶餘額不足');tx.update(aRef,{balance:next,updatedAt:Date.now()});tx.set(rRef,normalize(rec))})}
async function cloudDeleteRecord(rec){const dbm=cloud.firebase.dbmod;if(!rec.accountId){await dbm.deleteDoc(cloudRef(rec.id));return}const aRef=dbm.doc(cloud.db,'users',cloud.user.uid,'accounts',rec.accountId);await dbm.runTransaction(cloud.db,async tx=>{const s=await tx.get(aRef);if(s.exists())tx.update(aRef,{balance:Number(s.data().balance||0)-accountDelta(rec),updatedAt:Date.now()});tx.delete(cloudRef(rec.id))})}
function changePeriod(k){state.period=k;state.mode='details';state.anchor=new Date();render()}
function changeAnchor(step){const d=state.anchor;if(state.period==='day')d.setDate(d.getDate()+step);else if(state.period==='week')d.setDate(d.getDate()+step*7);else if(state.period==='month'){const x=new Date(d.getFullYear(),d.getMonth()+step,1,12);state.anchor=x}render()}
function navigate(page){state.page=page;window.scrollTo(0,0);render()}
function showModal(inner){modalHost.innerHTML=`<div class="overlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`}

function cloudBanner(){let title='',subtitle='';if(cloud.authResolving&&configured()){title='正在恢復上次登入';subtitle='無需重新輸入密碼，正在確認已保存的帳號';}else if(isCloud()){title=cloud.ready?'已連接雲端記帳':'正在讀取雲端資料';subtitle=cloud.pending?'有待同步變更 · '+cloud.user.email:cloud.ready?(cloud.user.email+' · 可跨裝置同步'):'正在連線或離線快取中';}else if(cloud.loading){title='準備雲端連線';subtitle='仍可先用本機模式記帳';}else{title='目前為本機記帳';subtitle=configured()?'點此登入，即可開始跨裝置同步':'設定 Firebase 後可啟用雲端同步';}return `<div class="cloud-strip"><span class="cloud-strip-icon">${isCloud()?'☁':'◇'}</span><div class="cloud-strip-text"><b>${html(title)}</b><span>${html(subtitle)}</span></div><button type="button" data-cloud-open="1">${isCloud()?'管理':'設定 ↗'}</button></div>`}

function editModal(id){const r=state.records.find(x=>x.id===id);if(!r)return;showModal(`<div class="modal-top"><h2>編輯這筆紀錄</h2><button data-close="1" aria-label="關閉">×</button></div><form id="editForm" data-id="${html(id)}"><div class="edit-grid"><div class="full"><label for="editDesc">項目名稱</label><input id="editDesc" maxlength="120" required value="${html(r.description)}"/></div><div><label for="editAmount">金額（NT$）</label><input id="editAmount" type="number" inputmode="decimal" step="0.01" min="0.01" max="999999999" required value="${r.amount}"/></div><div><label for="editDate">日期</label><input id="editDate" type="date" required value="${html(r.date)}"/></div><div><label for="editType">類型</label><select id="editType"><option value="expense" ${r.type==='expense'?'selected':''}>支出</option><option value="income" ${r.type==='income'?'selected':''}>收入</option></select></div><div><label for="editAccount">帳戶</label><select id="editAccount"><option value="">未指定</option>${formatAccountOptions(r.accountId||'')}</select></div><div><label for="editCategory">分類</label><select id="editCategory">${['收入',...CATEGORY_LIST].map(x=>`<option value="${x}" ${r.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="modal-actions"><button type="button" class="outline-btn" data-close="1">取消</button><button type="submit" class="primary-btn">儲存修改</button></div></form>`)}
function csvCell(x){return '"'+String(x).replace(/"/g,'""')+'"'}
function download(text,type,name){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportFile(kind){const date=today();if(kind==='json'){download(JSON.stringify({app:'暮金記帳',version:'2.1',exportedAt:new Date().toISOString(),records:state.records,accounts:state.accounts,transfers:state.transfers},null,2),'application/json;charset=utf-8','暮金記帳_V2.1_完整備份_'+date+'.json')}else{const lines=[['日期','類型','分類','項目','金額','帳戶'].map(csvCell).join(',')];sorted(state.records).forEach(r=>lines.push([r.date,r.type==='income'?'收入':'支出',r.category,r.description,r.amount,accountName(r.accountId||'')].map(csvCell).join(',')));download('\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8','暮金記帳_明細_'+date+'.csv')}showToast('檔案已送往瀏覽器下載')}
function handleImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result||''));const arr=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(arr))throw new Error('不是有效的備份格式');const ok=arr.filter(validRecord).map(normalize);if(arr.length&&!ok.length)throw new Error('沒有有效紀錄');const existing=new Set(state.records.map(x=>x.id));const unique=ok.filter(r=>{if(existing.has(r.id))return false;existing.add(r.id);return true});if(isCloud()){cloudImport(unique)}else{state.records.push(...unique);save();showToast('已匯入 '+unique.length+' 筆本機紀錄')}closeModal();render()}catch(err){showToast('匯入失敗：'+err.message)}};reader.onerror=()=>showToast('無法讀取這個檔案');reader.readAsText(file)}
function renderOnlyRecordsContent(){const el=document.getElementById('recordsContent');if(el)el.innerHTML=state.mode==='details'?renderDetails(getFiltered()):renderAnalytics(getFiltered());const r=getFiltered(),summary=document.querySelector('.record-summary');if(summary){const e=sum(r,'expense'),i=sum(r,'income'),b=i-e;summary.innerHTML=`<div class="summary-item"><div class="sm-label">總支出</div><div class="sm-value">${formatNumber(e)}</div></div><div class="summary-item"><div class="sm-label">總收入</div><div class="sm-value">${formatNumber(i)}</div></div><div class="summary-item"><div class="sm-label">收支結餘</div><div class="sm-value ${b>=0?'balance-positive':'balance-negative'}">${b<0?'−':''}${formatNumber(Math.abs(b))}</div></div>`}}

// Firebase SDK only loads when a valid web config is provided. Local mode has no external dependency.
// Persist sign-in across ordinary Safari/PWA app launches without saving passwords.
// Firebase Auth securely maintains its own refresh token in the current browser profile.
async function ensurePersistentAuth(auth,authmod){
  const candidates=[
    ['IndexedDB',authmod.indexedDBLocalPersistence],
    ['LocalStorage',authmod.browserLocalPersistence]
  ];
  const failures=[];
  for(const [name,persistence] of candidates){
    if(!persistence)continue;
    try{
      await authmod.setPersistence(auth,persistence);
      cloud.authPersistence=name;
      cloud.authPersistenceWarning='';
      return true;
    }catch(error){failures.push(name+': '+String(error?.code||error?.message||error))}
  }
  cloud.authPersistence='';
  cloud.authPersistenceWarning='此瀏覽器無法保存長期登入狀態。請使用一般 Safari（不要使用私密瀏覽）或從同一個主畫面圖示開啟。';
  return false;
}
async function initializeCloud(){
 if(!configured())return;
 if(cloud.firebase)return;
 cloud.loading=true;cloud.authResolving=true;cloud.error='';render();
 try{
  const base='https://www.gstatic.com/firebasejs/11.10.0/';
  const [appmod,authmod,dbmod]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=appmod.initializeApp(currentConfig());
  const auth=authmod.getAuth(app);
  const db=dbmod.getFirestore(app);
  cloud.firebase={authmod,dbmod};cloud.auth=auth;cloud.db=db;cloud.ready=false;cloud.error='';
  await ensurePersistentAuth(auth,authmod);
  cloud.loading=false;
  // Browsers may decline persistent cache (private mode, unsupported storage, multiple tabs).
  dbmod.enableMultiTabIndexedDbPersistence(db).catch(()=>{});
  authmod.onAuthStateChanged(auth,(user)=>{
    cloud.authResolving=false;cloud.ready=!!user;
    if(cloud.unsubscribe){cloud.unsubscribe();cloud.unsubscribe=null}
    if(cloud.accountsUnsubscribe){cloud.accountsUnsubscribe();cloud.accountsUnsubscribe=null}
    if(cloud.transfersUnsubscribe){cloud.transfersUnsubscribe();cloud.transfersUnsubscribe=null}
    cloud.user=user;
    if(user){
       cloud.ready=false;state.records=[];render();
       const owner=user.uid;
       const col=dbmod.collection(db,'users',owner,'records');
       cloud.unsubscribe=dbmod.onSnapshot(col,{includeMetadataChanges:true},(snapshot)=>{
         if(!cloud.user||cloud.user.uid!==owner)return;
         state.records=snapshot.docs.map(d=>normalize(d.data())).filter(validRecord);
         cloud.ready=!snapshot.metadata.fromCache;cloud.pending=!!snapshot.metadata.hasPendingWrites;
         render();
       },(error)=>{cloud.error=describeFirebaseError(error);cloud.ready=false;showToast('無法讀取雲端：'+cloud.error);render()});
       const accountsCol=dbmod.collection(db,'users',owner,'accounts');
       cloud.accountsUnsubscribe=dbmod.onSnapshot(accountsCol,(snap)=>{state.accounts=snap.docs.map(d=>normalizeAccount(d.data())).filter(validAccount).sort((a,b)=>a.createdAt-b.createdAt);if(!state.selectedAccount&&state.accounts.length)state.selectedAccount=state.accounts[0].id;render()},()=>{});
       const transfersCol=dbmod.collection(db,'users',owner,'transfers');
       cloud.transfersUnsubscribe=dbmod.onSnapshot(transfersCol,(snap)=>{state.transfers=snap.docs.map(d=>d.data()).filter(x=>x&&x.id);render()},()=>{});
    } else {state.accounts=[];state.transfers=[];load();cloud.ready=true;render()}
    refreshSettings();
  },(error)=>{cloud.authResolving=false;cloud.error=describeFirebaseError(error);showToast('帳號驗證失敗：'+cloud.error);render()});
  render();refreshSettings();
 }catch(error){cloud.loading=false;cloud.authResolving=false;cloud.ready=false;cloud.error='Firebase 載入失敗，請確認網路及設定：'+String(error.message||error).slice(0,90);showToast(cloud.error);render();refreshSettings()}
}
function describeFirebaseError(e){const code=String(e&&e.code||'');const m={'auth/invalid-credential':'帳號或密碼不正確','auth/email-already-in-use':'Email 已被註冊','auth/weak-password':'密碼強度不足','auth/invalid-email':'Email 格式有誤','auth/operation-not-allowed':'請先啟用 Email/Password 登入','auth/unauthorized-domain':'請在 Firebase 加入 GitHub Pages 授權網域','auth/network-request-failed':'網路無法連線','permission-denied':'權限不足，請檢查 Firestore Rules','unavailable':'目前無法連接雲端'};return m[code]||String(e.message||code||'未知錯誤').slice(0,110)}
function cloudRef(id){return cloud.firebase.dbmod.doc(cloud.db,'users',cloud.user.uid,'records',id)}
function cloudSet(rec){if(!isCloud())return;cloud.firebase.dbmod.setDoc(cloudRef(rec.id),normalize(rec)).catch(e=>{showToast('雲端儲存失敗：'+describeFirebaseError(e))})}
function cloudDelete(id){if(!isCloud())return;cloud.firebase.dbmod.deleteDoc(cloudRef(id)).catch(e=>showToast('雲端刪除失敗：'+describeFirebaseError(e)))}
async function cloudImport(list){if(!isCloud())return;let added=0;const seen=new Set(state.records.map(r=>r.id));const records=list.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true});
 try{for(let i=0;i<records.length;i+=400){const batch=cloud.firebase.dbmod.writeBatch(cloud.db);records.slice(i,i+400).forEach(r=>batch.set(cloudRef(r.id),normalize(r)));await batch.commit();added+=Math.min(400,records.length-i)}showToast('已提交 '+added+' 筆紀錄到雲端')}catch(e){showToast('雲端匯入失敗：'+describeFirebaseError(e))}}
async function clearCloud(){if(!isCloud())return;try{const ids=state.records.map(r=>r.id);for(let i=0;i<ids.length;i+=400){const batch=cloud.firebase.dbmod.writeBatch(cloud.db);ids.slice(i,i+400).forEach(id=>batch.delete(cloudRef(id)));await batch.commit()}showToast('雲端紀錄已清空')}catch(e){showToast('清空失敗：'+describeFirebaseError(e))}}
async function registerAccount(){const email=document.getElementById('authEmail')?.value.trim(),pass=document.getElementById('authPassword')?.value;if(!email||!pass||pass.length<6){showToast('請輸入 Email 與至少 6 字元密碼');return}try{await cloud.firebase.authmod.createUserWithEmailAndPassword(cloud.auth,email,pass);closeModal();showToast('帳號建立成功')}catch(e){showToast(describeFirebaseError(e))}}
async function resetPassword(){const email=document.getElementById('authEmail')?.value.trim();if(!email){showToast('先輸入 Email 再點忘記密碼');return}try{await cloud.firebase.authmod.sendPasswordResetEmail(cloud.auth,email);showToast('如帳號存在，將收到重設密碼郵件')}catch(e){showToast(describeFirebaseError(e))}}
// Bind events only once. Re-rendering replaces inner content but keeps delegates stable.
document.addEventListener('click',(event)=>{const el=event.target.closest('button');if(!el)return;
  if(el.id==='settingsOpen'||el.id==='cloudOpen'||el.dataset.cloudOpen){settingsModal();return}
  if(el.dataset.configEdit){showConfigEditor();return}
  if(el.dataset.register){registerAccount();return}
  if(el.dataset.resetPassword){resetPassword();return}
  if(el.dataset.signout){cloud.firebase.authmod.signOut(cloud.auth).then(()=>{closeModal();showToast('已登出，切回本機紀錄')}).catch(e=>showToast(describeFirebaseError(e)));return}
  if(el.dataset.uploadLocal){if(confirm('要把本機 '+localRecords.length+' 筆記帳資料合併到目前雲端帳號嗎？相同 ID 不覆蓋。')){cloudImport(localRecords);closeModal()}return}
  if(el.dataset.refreshFx){getUsdTwdRate(true).then(r=>{showToast('最新匯率：1 USD ≈ NT$ '+Number(r).toFixed(4));render()}).catch(()=>showToast('匯率查詢失敗'));return}
  if(el.dataset.adjustAccount){const a=state.accounts.find(x=>x.id===el.dataset.adjustAccount);if(!a)return;const v=prompt('校正「'+a.name+'」餘額（NT$）',String(a.balance));if(v===null)return;adjustAccount(a.id,v).then(()=>showToast('帳戶餘額已更新')).catch(e=>showToast('更新失敗：'+describeFirebaseError(e)));return}
  if(el.dataset.deleteAccount){const a=state.accounts.find(x=>x.id===el.dataset.deleteAccount);if(!a)return;if(confirm('確定刪除「'+a.name+'」？只有餘額為 0 且沒有歷史紀錄時才允許刪除。'))deleteAccount(a.id).then(()=>showToast('帳戶已刪除')).catch(e=>showToast('刪除失敗：'+describeFirebaseError(e)));return}
  if(el.dataset.page){navigate(el.dataset.page);return}
  if(el.dataset.pageLink){navigate(el.dataset.pageLink);return}
  if(el.dataset.example){const input=document.getElementById('quickInput');if(input){input.value=el.dataset.example;input.focus();input.setSelectionRange(input.value.length,input.value.length)}return}
  if(el.dataset.period){changePeriod(el.dataset.period);return}
  if(el.dataset.mode){state.mode=el.dataset.mode;render();return}
  if(el.dataset.step){changeAnchor(Number(el.dataset.step));return}
  if(el.dataset.edit){editModal(el.dataset.edit);return}
  if(el.dataset.delete){const target=state.records.find(r=>r.id===el.dataset.delete);if(target&&confirm('確定刪除「'+target.description+'」'+money(target.amount)+'？')){if(isCloud()){cloudDeleteRecord(target).then(()=>showToast('這筆紀錄已刪除')).catch(e=>showToast('刪除失敗：'+describeFirebaseError(e)))}else{state.records=state.records.filter(r=>r.id!==target.id);save();render();showToast('這筆紀錄已刪除')}}return}
  if(el.dataset.close){closeModal();return}
  if(el.dataset.export){exportFile(el.dataset.export);return}
  if(el.id==='importTrigger'){document.getElementById('importFile').click();return}
  if(el.dataset.clear){if(confirm('確定清空全部 '+state.records.length+' 筆紀錄嗎？\n請先下載 JSON 備份。')&&confirm('最後確認：所有本機記帳紀錄將被刪除。')){if(isCloud())clearCloud();else{state.records=[];save();}closeModal();render();if(!isCloud())showToast('本機紀錄已清空')}return}
  if(el.id==='toastUndo'){if(state.lastAddedId){const target=state.records.find(r=>r.id===state.lastAddedId);if(isCloud()&&target){cloudDeleteRecord(target).then(()=>showToast('已撤銷上一筆新增')).catch(e=>showToast('撤銷失敗：'+describeFirebaseError(e)))}else{state.records=state.records.filter(r=>r.id!==state.lastAddedId);save();render();showToast('已撤銷上一筆新增')}state.lastAddedId=null}return}
});
document.addEventListener('submit',(event)=>{if(event.target.id==='authForm'){event.preventDefault();if(!cloud.auth){showToast('Firebase 尚未連線');return}const email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPassword').value;ensurePersistentAuth(cloud.auth,cloud.firebase.authmod).then(()=>cloud.firebase.authmod.signInWithEmailAndPassword(cloud.auth,email,pass)).then(()=>{closeModal();showToast('登入成功，下次將自動恢復帳號')}).catch(e=>showToast('登入失敗：'+describeFirebaseError(e)));return}if(event.target.id==='configForm'){event.preventDefault();try{const cfg=JSON.parse(document.getElementById('configJson').value.trim());if(!cfg||!['apiKey','authDomain','projectId','appId'].every(k=>typeof cfg[k]==='string'&&cfg[k].trim()))throw Error('需要 apiKey、authDomain、projectId 與 appId');const hadCloud=!!cloud.firebase;localStorage.setItem(CONFIG_STORAGE_KEY,JSON.stringify({apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,appId:cfg.appId,messagingSenderId:cfg.messagingSenderId||'',storageBucket:cfg.storageBucket||''}));closeModal();if(hadCloud){window.location.reload()}else{initializeCloud();showToast('已儲存 Firebase 設定，正在連線')}}catch(e){showToast('設定不正確：'+e.message)}return}if(event.target.id==='accountForm'){event.preventDefault();const name=document.getElementById('accountName').value,kind=document.getElementById('accountKind').value,balance=document.getElementById('accountBalance').value;createAccount(name,kind,balance).then(()=>{showToast('帳戶已新增');render()}).catch(e=>showToast('新增失敗：'+describeFirebaseError(e)));return}if(event.target.id==='transferForm'){event.preventDefault();const from=document.getElementById('transferFrom').value,to=document.getElementById('transferTo').value,amount=document.getElementById('transferAmount').value,desc=document.getElementById('transferDesc').value.trim();createTransfer(from,to,amount,desc).then(()=>{showToast('資金轉移完成');render()}).catch(e=>showToast('轉移失敗：'+describeFirebaseError(e)));return}if(event.target.id==='quickForm'){event.preventDefault();const input=event.target.querySelector('input');addEntry(input.value).then(ok=>{if(ok)input.value='' });return}if(event.target.id==='editForm'){event.preventDefault();const id=event.target.dataset.id,r=state.records.find(x=>x.id===id);if(!r)return;const description=document.getElementById('editDesc').value.trim();const amount=Number(document.getElementById('editAmount').value);const date=document.getElementById('editDate').value;const type=document.getElementById('editType').value;let category=document.getElementById('editCategory').value;if(!description||!Number.isFinite(amount)||amount<=0||amount>999999999||!/^\d{4}-\d{2}-\d{2}$/.test(date)){showToast('請輸入正確的項目、日期與金額');return}if(type==='income')category='收入';else if(category==='收入')category=classify(description).category==='收入'?'其他':classify(description).category;const newAccount=document.getElementById('editAccount')?.value||r.accountId||'';if(isCloud()&&((amount!==r.amount)||(type!==r.type)||(newAccount!==(r.accountId||'')))){showToast('雲端交易若要改金額／收支／帳戶，請先刪除後重新新增，避免資產餘額失真');return}Object.assign(r,{description,amount,date,type,category,...(newAccount?{accountId:newAccount}:{})});if(isCloud())cloudSet(r);else save();closeModal();render();showToast(isCloud()?'修改已送往雲端':'修改已儲存')}});
document.addEventListener('input',(event)=>{if(event.target.id==='historyQuery'){state.query=event.target.value;renderOnlyRecordsContent()}});
document.addEventListener('change',(event)=>{const id=event.target.id;if(id==='quickAccount'){state.selectedAccount=event.target.value;return;}if(id==='historyType'){state.historyType=event.target.value;renderOnlyRecordsContent()}else if(id==='historyCategory'){state.historyCategory=event.target.value;renderOnlyRecordsContent()}else if(id==='fromDate'){state.from=event.target.value;renderOnlyRecordsContent()}else if(id==='toDate'){state.to=event.target.value;renderOnlyRecordsContent()}else if(id==='editType'){const cat=document.getElementById('editCategory');if(cat){if(event.target.value==='income')cat.value='收入';else if(cat.value==='收入')cat.value='其他'}}else if(id==='importFile'){handleImport(event.target.files && event.target.files[0])}});
